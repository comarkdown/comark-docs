name: bundle-size

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: bundle-size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NUXT_BUNDLE_ANALYZER_VERSION: 0.2.0

jobs:
  # Analyzes `main` and the PR side by side, compared and posted by `bundle-size-comment.yml`.
  analyze:
    name: analyze (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        target: [base, pr]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The base commit for `base`, the PR merged into it for `pr`.
          ref: ${{ matrix.target == 'base' && github.event.pull_request.base.sha || '' }}
      - uses: ./.github/actions/setup
      # With npx, so the analyzer needs no entry in the lockfile.
      - name: Analyze the playground
        run: npx --yes "nuxt-bundle-analyzer@$NUXT_BUNDLE_ANALYZER_VERSION" playground --name ${{ matrix.target }} --no-serve
        env:
          # The content snapshot confirms its commit with GitHub, so both sides ship one.
          GITHUB_TOKEN: ${{ github.token }}
          # The analysis build peaks around 5.5 GB, above Node's default heap.
          NODE_OPTIONS: --max-old-space-size=8192
          NUXT_TELEMETRY_DISABLED: 1
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: playground/node_modules/.cache/nuxt-bundle-analyzer/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
