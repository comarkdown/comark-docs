name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Superseded runs are pointless: every push rebuilds the whole dep tree.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Lint and unit tests need no generated types, so they run before `prepare`
      # and fail fast.
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm dev:prepare
      - run: pnpm typecheck
      # Builds the playground: module setup, bundling, and the generated ISR route rules.
      - run: pnpm build
      - run: pnpm test:e2e
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NUXT_DOCS_GITHUB_BRANCH: ${{ github.sha }}
      # Continuous preview releases via pkg.pr.new: every commit gets an installable
      # tarball (https://pkg.pr.new/comarkdown/comark-docs@<sha>), so downstream sites
      # can test the layer before a release. Requires the pkg.pr.new GitHub App.
      - run: pnpx pkg-pr-new publish --compact --no-template --pnpm

  # The Vercel output as a deploy would get it: ISR functions and their TTLs, the bypass token, the server function.
  vercel:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
        env:
          NITRO_PRESET: vercel
          VERCEL_BYPASS_TOKEN: ci-placeholder-bypass-token-0000000000
      - run: pnpm test:vercel

  # The layer as a site installs it: packed, outside the workspace, built in a fresh app.
  pack:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          install: false
      - run: ./scripts/test-pack.sh

  # comark.dev, a site extending the layer, built against this commit instead of the version it pins.
  # cms.comark.dev joins once its repository is public, a private one would need a token secret.
  consumer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: comarkdown/comark
          path: .consumer
      - uses: ./.github/actions/setup
        with:
          install: false
      - run: ./scripts/test-consumer.sh .consumer
