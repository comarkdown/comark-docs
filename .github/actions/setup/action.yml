name: setup
description: Node.js and the pnpm version `packageManager` pins, then the workspace dependencies.

inputs:
  install:
    description: Install the workspace dependencies, not needed by jobs that only pack the layer.
    default: 'true'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        package-manager-cache: false
        node-version: '24.22.2'
    - run: npm i -g --force corepack && corepack enable
      shell: bash
    - if: inputs.install == 'true'
      run: pnpm install --frozen-lockfile
      shell: bash
