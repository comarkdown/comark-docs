packages:
  - playground

allowBuilds:
  esbuild: false
  unrs-resolver: false
  vue-demi: false

blockExoticSubdeps: false

minimumReleaseAgeExclude:
  # First-party packages, published and consumed here in the same session.
  - '@comark/nuxt'
  - '@comark/vue'
  - comark
  - comark-content
  - nuxt-agent-discovery

overrides:
  # Keep the workspace on a single h3 major (v1), matching comark-content.
  h3: ^1.15.11
  # Until nitrojs/nitro#4651 is released: header-only Vercel routes need `continue: true`.
  nitropack: https://pkg.pr.new/nitrojs/nitro/nitropack@4651
