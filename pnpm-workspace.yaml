packages:
  - playground

allowBuilds:
  esbuild: false
  unrs-resolver: false
  vue-demi: false

blockExoticSubdeps: false

minimumReleaseAgeExclude:
  # First-party packages, published and consumed here in the same session.
  - '@comark/nuxt'
  - '@comark/vue'
  - comark
  - comark-content
  - nuxt-agent-discovery

overrides:
  # Keep the workspace on a single h3 major (v1), matching comark-content.
  h3: ^1.15.11
  comark: ^0.7.0
  nitropack: https://pkg.pr.new/nitrojs/nitro/nitropack@4651

patchedDependencies:
  nuxt@4.5.2: patches/nuxt@4.5.2.patch
  '@nuxt/nitro-server@4.5.2': patches/@nuxt__nitro-server@4.5.2.patch
